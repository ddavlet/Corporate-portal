server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Docker встроенный DNS — резолвим имя сервиса при запросе, а не при старте nginx
  # (иначе «host not found in upstream backend_v2», если фронт поднялся раньше бэкенда).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # SPA is mounted under /app/ — send browsers there from bare /
  location = / {
    # Preserve host:port (e.g. localhost:3000) — bare `return /app/` becomes absolute without port
    return 302 $scheme://$http_host/app/;
  }

  location = /app {
    return 301 /app/;
  }

  # PWA: service worker and manifest must never be served stale and must not fall
  # back to index.html (a missing sw.js has to be a real 404, not HTML).
  # A location-level add_header drops inherited ones, so each block lists all of its own.
  location = /app/sw.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/app/" always;
  }

  location = /app/manifest.webmanifest {
    root /usr/share/nginx/html;
    try_files $uri =404;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # Any other top-level script under /app/ (e.g. an old or mistyped SW path) must 404
  # instead of getting index.html as JavaScript. Exact `= /app/sw.js` wins over this regex.
  location ~ ^/app/[^/]+\.js$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed Vite build assets: immutable, never replaced by index.html.
  location /app/assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA is served under /app/; index.html must be revalidated so a deploy is picked up.
  location /app/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache" always;
  }

  location /api/ {
    set $django_upstream backend_v2;
    proxy_pass http://$django_upstream:8001;
    # Backend resolves tenant from Host subdomain (BASE_DOMAIN=localhost → test.localhost → tenant "test").
    # Plain "localhost" has no subdomain → TenantSubdomainMiddleware returns 404.
    proxy_set_header Host test.localhost;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
