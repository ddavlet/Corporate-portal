# Edge Traefik for the kolberg VPS: owns host ports 80/443 and the Let's
# Encrypt certificates for every project on this server. Projects attach to
# the network n8n_traefik-public and publish routers via Docker labels.
#
# Kept apart from the n8n project so that its deploys, `down` or image pulls
# can't take every site down. Network and volume keep their historical n8n_*
# names (external here), so no project and no certificate had to change.
#
#   cd ~/n8n/edge && docker compose up -d
#
# Image is pinned to the major version: `docker compose pull` brings v3.x
# fixes, a v4 upgrade is a deliberate tag change. Never `latest`.

name: edge

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public

volumes:
  traefik_data:
    external: true
    name: n8n_traefik_data

networks:
  traefik-public:
    external: true
    name: n8n_traefik-public
