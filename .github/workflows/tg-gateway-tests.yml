name: TG Gateway Tests

on:
  pull_request:
    branches:
      - main
      - "dev/**"
      - "fix/**"
    paths:
      - "tg-gateway/**"
      - ".github/workflows/tg-gateway-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: tg-gateway pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: tg-gateway

    env:
      DATABASE_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tg-gateway/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_endpoints.py is a manual integration script against a live gateway — not run here.
      - name: Run tests
        run: python -m pytest test_log_redaction.py test_gateway.py -v
